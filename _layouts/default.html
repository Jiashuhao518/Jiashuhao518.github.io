<!DOCTYPE html>
<html>
  {% include head.html %}
  <body>
    {% include nav.html %}

    {% if page.toc==true %}
      <aside class="toc">
        {% include toc.html html=content %}
      </aside>
    {% endif %}

    <div id="main" role="main" class="wrapper-content">
      <div class="container">
        {{ content }}
      </div>
    </div>

    <div class="wrapper-footer-mobile">
      <footer class="footer">
        {% include footer.html %}
      </footer>
    </div>

    {% include analytics.html %}

    {% if page.toc==true %}
    <script>
      document.getElementById("main").classList.add("withtoc");
    </script>
    {% endif %}

    <script>
      (function () {
        var body = document.body;
        var buttons = document.querySelectorAll('.theme-dot');
        var search = document.getElementById('search-input');
        var savedTheme = window.localStorage.getItem('shuhao-theme') || 'ink';
        var themes = ['ink', 'paper', 'terminal'];

        if (themes.indexOf(savedTheme) === -1) {
          savedTheme = 'ink';
        }

        function setTheme(theme) {
          body.setAttribute('data-theme', theme);
          buttons.forEach(function (button) {
            button.classList.toggle('is-active', button.getAttribute('data-theme') === theme);
          });
          window.localStorage.setItem('shuhao-theme', theme);
        }

        setTheme(savedTheme);
        buttons.forEach(function (button) {
          button.addEventListener('click', function () {
            setTheme(button.getAttribute('data-theme'));
          });
        });

        document.addEventListener('keydown', function (event) {
          if (event.key === '/' && search && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
            event.preventDefault();
            search.focus();
          }
        });
      })();
    </script>
  </body>


</html>


<script type="text/x-mathjax-config">
  MathJax.Hub.Config({
      TeX: {
        equationNumbers: {
          autoNumber: "AMS"
        }
      },
      extensions: ["tex2jax.js"],
      jax: ["input/TeX", "output/HTML-CSS"],
      tex2jax: {
      inlineMath: [ ['$','$'], ["\\(","\\)"] ],
      displayMath: [ ['$$','$$'], ["\\[","\\]"] ],
      processEscapes: true,
      "HTML-CSS": { fonts: ["TeX"] }
    }
  });
  MathJax.Hub.Register.MessageHook("Math Processing Error",function (message) {
        alert("Math Processing Error: "+message[1]);
      });
  MathJax.Hub.Register.MessageHook("TeX Jax - parse error",function (message) {
        alert("Math Processing Error: "+message[1]);
      });
</script>
<script
  type="text/javascript"
  async
  src="https://cdn.mathjax.org/mathjax/latest/MathJax.js?config=TeX-MML-AM_CHTML"
></script>
