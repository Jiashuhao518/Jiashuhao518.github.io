<div class="wrapper-sidebar">
  <header class="sidebar clearfix">
    <div class="site-info">
      {% if site.avatar %}
        <a href="{{ site.baseurl }}/" class="site-avatar"><img src="{{ site.avatar }}" /></a>
      {% endif %} 
      <h1 class="site-name"><a href="{{ site.baseurl }}/">{{ site.name }}</a></h1>
      <p class="site-description">{{ site.description }}</p>
    </div>
  </header>

  <div class="navlist">
    <nav>
      {% for nav in site.navigation %}
      {% if nav.url contains 'http://' or nav.url contains 'https://' %}
      <a href="{{ nav.url }}">{{ nav.name }}</a>
      {% else %}
      <a href="{{ site.baseurl }}{{ nav.url }}">{{ nav.name }}</a>
      {% endif %}
      {% endfor %}
    </nav>
  </div>

  <div class="theme-switcher" role="group" aria-label="选择页面主题">
    <span>主题</span>
    <button type="button" class="theme-dot theme-dot-ink is-active" data-theme="ink" aria-label="墨蓝主题" title="墨蓝主题"></button>
    <button type="button" class="theme-dot theme-dot-paper" data-theme="paper" aria-label="纸张主题" title="纸张主题"></button>
    <button type="button" class="theme-dot theme-dot-terminal" data-theme="terminal" aria-label="终端主题" title="终端主题"></button>
  </div>

  <div class="wrapper-footer-desktop">
    <footer class="footer">
      {% include footer.html %}
    </footer>
  </div>
</div>
